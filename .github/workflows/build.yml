name: Thunar‑xfce CI/CD

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt update && sudo apt install -y thunar tumbler xfconf

      - name: Run SystemCheck
        run: bash SystemCheck.sh

      - name: Validate actions
        run: test -d actions

      - name: Validate plugins
        run: test -d plugins

      - name: Build Debian package
        run: dpkg-deb --build debian thunar-xfce_1.0.0_all.deb
