name: THUNAR-XFCE CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  lint:
    name: Vérification Bash
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint des scripts
        run: |
          find . -type f -name "*.sh" -print0 | xargs -0 shellcheck

  test:
    name: Tests basiques
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier les permissions des scripts
        run: |
          find . -type f -name "*.sh" -exec chmod +x {} \;

      - name: Test exécution à blanc
        run: |
          for script in $(find . -type f -name "*.sh"); do
            echo "Test: $script"
            bash -n "$script"
          done

  build:
    name: Build & Packaging
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Créer archive du projet
        run: |
          mkdir -p build
          tar -czf build/thunar-xfce.tar.gz \
            --exclude=".git" \
            --exclude="build" \
            .

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: thunar-xfce-build
          path: build/thunar-xfce.tar.gz
