# ============================
#  THUNAR-XFCE — Plugins (avancé)
# ============================

# Activation
plugin_gtkhash = yes
plugin_archive = yes
plugin_vcs = yes
plugin_volman = yes

# Priorités (0 = faible, 10 = critique)
priority_gtkhash = 5
priority_archive = 8
priority_vcs = 6
priority_volman = 7

# Versions minimales requises
version_gtkhash = 1.4
version_archive = 0.5
version_vcs = 0.3
version_volman = 0.9

# Hooks (scripts exécutés après installation)
hook_gtkhash = /opt/thunar-xfce/plugins/hooks/gtkhash.sh
hook_archive = /opt/thunar-xfce/plugins/hooks/archive.sh
hook_vcs = /opt/thunar-xfce/plugins/hooks/vcs.sh
hook_volman = /opt/thunar-xfce/plugins/hooks/volman.sh

# Installation automatique
auto_install_dependencies = yes
auto_update_plugins = no
