# ============================
#  THUNAR-XFCE — Configuration des actions
# ============================

# Activer ou désactiver certaines actions
action_compress = yes
action_checksum = yes
action_media_info = yes
action_open_terminal = yes
action_secure_delete = yes

# Options avancées
# Niveau de suppression sécurisée : low / medium / high
secure_delete_level = medium

# Format de compression par défaut : zip / tar / tar.gz
default_compression = zip
