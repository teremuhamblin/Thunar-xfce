# ============================
#  THUNAR-XFCE — Configuration générale
# ============================

# Activer le mode verbeux (yes/no)
verbose = no

# Activer les logs détaillés (yes/no)
debug = no

# Chemin d'installation du projet
install_dir = /opt/thunar-xfce

# Fichier de log principal
log_file = /var/log/thunar-xfce.log

# Activer la bannière animée (yes/no)
animated_banner = yes
